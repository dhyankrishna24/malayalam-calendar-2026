name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/Malayalam_Calendar_2026_Release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/Malayalam_Calendar_2026_Debug.apk
          fi
          curl -sL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer.jar --allowResign --ks app/release.keystore --ksAlias calendar --ksPass androidpassword --ksKeyPass androidpassword -a artifacts --overwrite

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Malayalam-Calendar-2026-APK
          path: artifacts/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Malayalam Calendar 2026 v1.0.${{ github.run_number }} (Classic Kerala Edition)
          make_latest: true
          body: |
            ## 📅 Malayalam Calendar 2026 (മലയാളം കലണ്ടർ 2026)
            
            ### ✨ Authentic Kerala Calendar Features (Template Match)
            - **Classic Temple Maroon Header**: Traditional deep maroon top bar and month navigator with Kollam Era subtitle (`1202 തുലാം - വൃശ്ചികം` / `1201 മിഥുനം - കർക്കടകം`).
            - **2-Line Weekday Header**: English (SUN, MON...) and Malayalam (ഞായർ, തിങ്കൾ...) with Sunday in Red.
            - **Kerala Table Grid**:
              - Malayalam date number / Sankranti month start (top-left)
              - Moon Phase (⚫ Amavasya / ⚪ Pournami) & Bank Holiday (`BH` in red) (top-right)
              - Bold Gregorian date number (Red for Sundays & Bank Holidays, Black for weekdays)
              - Nakshathram name in Malayalam (bottom)
              - Today Highlight: Distinct warm amber outline and background for instant spotting.
            - **Detailed Day View**:
              - Maroon top bar with back arrow (`←`)
              - Centered Month & Year (`ഓഗസ്റ്റ്, 2026`)
              - Centered Square Date Box with huge date number and Malayalam weekday (`ഞായർ`)
              - Malayalam Date line (`കർക്കടകം 31, 1201`)
              - `നക്ഷത്രം` & `തിഥി` in red labels
              - Warm Golden Festival Card listing all observances and temple events
              - Traditional Kerala Rahu & Gulikai timings, Shaka Samvat, and Hijri calendar dates
              - Muslim Prayer Times for Kozhikode (`ളൂഹ്ർ`, `അസർ`, `മഗ്‌രിബ്`, `ഇശാ`, `സുബ്ഹി`, `ഉദയം`)
              - Illustrated Sun graphic with Sunrise & Sunset timings
            
            ### 📥 Download
            Download `Malayalam_Calendar_2026_Release.apk` below and install directly on your Android phone (Android 6.0+ supported, including POCO F1).
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
